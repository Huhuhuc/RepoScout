name: Local verification
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m evals.run
      - run: python -m evals.compare
      - run: python -m evals.validate_dataset evals/multi-repo-cases.json
      - run: node --check web/workspace.js
      - run: python -m compileall -q reposcout evals
      # No model keys and no paid evaluation in CI.
